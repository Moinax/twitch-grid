<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Twitch grid · Image de partage</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { color: #efeff1; font-family: Arial, sans-serif; background: #0e0e10; }
  .card { position: relative; width: 100%; height: 100%; padding: 64px; background: radial-gradient(ellipse at 85% 42%, #9147ff38, transparent 54%), radial-gradient(ellipse at 10% 100%, #9147ff14, transparent 50%); }
  .card::after { content: ''; position: absolute; inset: 20px; border: 1px solid #ffffff14; border-radius: 24px; pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 700; letter-spacing: -1px; }
  .brand img { width: 64px; height: 64px; }
  h1 { margin: 64px 0 24px; font-size: 61px; line-height: 1.08; letter-spacing: -2.8px; }
  h1 span { color: #bf94ff; }
  p { margin: 0; color: #b8b8c4; font-size: 23px; line-height: 1.55; letter-spacing: -.35px; }
  .domain { position: absolute; bottom: 66px; display: flex; align-items: center; gap: 12px; font-size: 20px; color: #d9c4fa; }
  .domain::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #a970ff; box-shadow: 0 0 15px #9147ff; }
  .app { position: absolute; left: 654px; top: 155px; width: 480px; height: 326px; padding: 12px; border: 1px solid #8b6fb355; border-radius: 16px; background: #17151e; box-shadow: 0 32px 80px #0009, 0 0 100px #9147ff12; transform: rotate(-5deg); }
  .toolbar { height: 26px; display: flex; align-items: flex-start; gap: 5px; }
  .toolbar i { width: 5px; height: 5px; border-radius: 50%; background: #64576f; }
  .toolbar span { margin: -3px 0 0 auto; color: #aa98c2; font-size: 9px; letter-spacing: 1.5px; }
  .grid { display: grid; grid-template-columns: 2.2fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 9px; height: 274px; }
  .tile { position: relative; border: 1px solid #ffffff15; border-radius: 6px; overflow: hidden; }
  .tile.main { grid-row: 1 / 4; border-color: #a970ff; background: linear-gradient(155deg, #6d3db0, #2a1b4b 55%, #17283f); }
  .tile.top { background: linear-gradient(150deg, #205964, #14262e); }
  .tile.middle { background: linear-gradient(150deg, #804449, #301e40); }
  .tile.bottom { background: linear-gradient(150deg, #343e76, #171d32); }
  .tile .bar { height: 18px; background: #0005; display: flex; align-items: center; gap: 5px; padding: 0 7px; }
  .main .bar { background: #9147ff; height: 22px; }
  .bar i { width: 4px; height: 4px; border-radius: 50%; background: #efeff1; }
  .bar span { height: 3px; width: 30px; border-radius: 2px; background: #ffffff80; }
  .bar b { margin-left: auto; font-size: 7px; letter-spacing: 1px; font-weight: 400; color: #ffffffc0; }
  .scene { position: absolute; inset: 22px 0 0; }
  .scene::before { content: ''; position: absolute; width: 85px; height: 85px; top: 35px; right: 42px; background: linear-gradient(#ebafff, #ad73ec); border-radius: 50%; box-shadow: 0 0 45px #bd8fee60; }
  .mountain { position: absolute; bottom: 0; width: 100%; height: 70%; background: #151628; clip-path: polygon(0 60%, 30% 8%, 60% 66%, 80% 25%, 100% 67%, 100% 100%, 0 100%); }
  .mountain.back { background: #3e2a60; bottom: 28px; transform: scaleX(-1); }
  .tile.top::after { content: ''; position: absolute; inset: 34px 15px -18px; border: 1px solid #92e8e380; border-radius: 50%; box-shadow: 0 0 0 12px #68c3c318, 0 0 0 25px #68c3c310; transform: rotate(-25deg); }
  .tile.middle::after { content: ''; position: absolute; width: 48px; height: 48px; left: 38px; top: 30px; background: linear-gradient(135deg, #e9a07b, #cb6492); transform: rotate(45deg); border-radius: 6px; box-shadow: 14px 14px 0 #ffffff0b; }
  .tile.bottom::after { content: ''; position: absolute; inset: 26px 10px -10px; background: repeating-linear-gradient(90deg, transparent 0 14px, #8eafff35 14px 15px), repeating-linear-gradient(0deg, transparent 0 14px, #8eafff35 14px 15px); transform: perspective(90px) rotateX(35deg); }
  .play { position: absolute; top: 112px; left: 126px; width: 44px; height: 44px; border: 1px solid #ffffff40; border-radius: 50%; background: #ffffff15; display: grid; place-items: center; backdrop-filter: blur(5px); }
  .play::after { content: ''; margin-left: 3px; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #fff; }
  .controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 12px 10px; background: linear-gradient(transparent, #0009); display: flex; gap: 7px; align-items: center; }
  .pause { width: 9px; height: 10px; border-left: 3px solid #ffffffc0; border-right: 3px solid #ffffffc0; }
  .volume { height: 3px; width: 43px; background: #ffffff45; border-radius: 3px; }
  .volume::before { content: ''; display: block; width: 26px; height: 3px; background: #fff; border-radius: 3px; }
  .live { margin-left: auto; color: #ffffffc0; font-size: 7px; letter-spacing: 1px; }
  .caption { position: absolute; right: 91px; bottom: 83px; color: #9d87b8; font-size: 13px; letter-spacing: .4px; }
</style>
<main class="card">
  <div class="brand"><img src="../favicon.svg" alt="">Twitch grid</div>
  <h1>Tous tes streams.<br><span>Un seul écran.</span></h1>
  <p>Tes follows ou tes favoris,<br>avec le son et la disposition de ton choix.</p>
  <div class="domain">twitch.moinax.com</div>
  <div class="app" aria-hidden="true">
    <div class="toolbar"><i></i><i></i><i></i><span>TWITCH GRID</span></div>
    <div class="grid">
      <div class="tile main"><div class="bar"><i></i><span></span><b>EN DIRECT</b></div><div class="scene"><div class="mountain back"></div><div class="mountain"></div></div><div class="play"></div><div class="controls"><div class="pause"></div><div class="volume"></div><span class="live">EN DIRECT</span></div></div>
      <div class="tile top"><div class="bar"><i></i><span></span></div></div>
      <div class="tile middle"><div class="bar"><i></i><span></span></div></div>
      <div class="tile bottom"><div class="bar"><i></i><span></span></div></div>
    </div>
  </div>
  <div class="caption">Plusieurs streams, une grille.</div>
</main>
</html>
